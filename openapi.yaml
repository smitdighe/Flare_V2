openapi: 3.1.0

# Flare Backend v2 — frozen API contract (PLAN.md Phase 0).
#
# Derived by reading frontend/src end to end. Every schema below is what the
# frozen frontend actually parses, with the file:line citation in the
# description. Companion document: CONTRACT.md.
#
# ENVELOPE — DECIDED. {ok, data, meta} per PLAN §3.2/D17 is the DEFAULT for
# every response, and is mandatory for every new or modifiable shape.
#
# Against that default there is a PINNED EXCEPTION LIST of 11 operations whose
# response body the frozen frontend already consumes raw — it reads a top-level
# key (`d.rules`, `data.access_token`) or takes the whole body as state
# (`setUser(data)`). Wrapping those makes the key undefined and the screen
# renders empty. Each is marked `x-flare-envelope: none` at the operation, with
# the consuming file:line. The list is CLOSED: a new operation is enveloped,
# and nothing joins this list without a frontend change.
# Full list and rationale: CONTRACT.md §1.3.1.
#
# Operations that return a body nothing reads (POST /rules, PUT /playbooks,
# DELETE *, …) are ENVELOPED — only their error bodies are constrained.
#
# ERRORS. Six call sites read a flat `err.detail` (CONTRACT.md §1.4). Error
# bodies therefore carry BOTH a top-level `detail` string and the structured
# `error` object from PLAN §3.2, on enveloped and exception operations alike.
# See the Error schema.
#
# SANCTIONED FRONTEND CHANGES referenced below: FE-1 vite ws:true, FE-2 WS
# handshake + presence, FE-3 API base paths, FE-4 pipeline labels, FE-5 remove
# fabricated literals, FE-6 fetch GET /alerts on mount, FE-7 drawer reads the
# real trace, FE-8 data-driven 4x4 confusion matrix, FE-9 complete
# SEVERITY_LABELS. Table: CONTRACT.md §0.

info:
  title: Flare Backend v2
  version: 2.0.0
  description: >
    AI-powered SOC alert triage pipeline. This specification is the frozen
    contract against the teammate-owned frontend; it is written to fit the
    existing UI, not the other way around. Open questions that the frontend
    does not pin down are recorded in CONTRACT.md §9 and are marked `TBD` in
    the descriptions below rather than invented here.

servers:
  - url: /api/v1
    description: >
      All frontend calls are same-origin relative under this prefix
      (VITE_API_BASE defaults to '', frontend/src/contexts/AuthContext.jsx:5).

tags:
  - name: auth
  - name: alerts
  - name: ingest
  - name: stream
  - name: health
  - name: stats
  - name: audit
  - name: eval
  - name: rules
  - name: playbooks
  - name: notifications
  - name: export

security:
  - bearerAuth: []

paths:

  # ─────────────────────────────────────────────────────────────────────
  # AUTH — frontend/src/contexts/AuthContext.jsx, pages/SettingsPage.jsx
  # ─────────────────────────────────────────────────────────────────────

  /auth/login:
    post:
      tags: [auth]
      summary: Sign in
      x-flare-envelope: none   # PINNED EXCEPTION 1/11 — AuthContext.jsx:140 reads data.access_token
      security: []
      description: >
        AuthContext.jsx:119. Frontend reads data.access_token,
        data.refresh_token and data.user directly off the body — NOT enveloped.
        On failure it reads err.detail (AuthContext.jsx:128).
        The login screen claims "jwt · 30m access"
        (flare/AuthPanel.jsx:292); the access token lifetime must literally be
        30 minutes for that claim to be true (PLAN §3.1).

        DEMO ACCOUNT — DECIDED (CONTRACT.md §8.7). The frozen frontend has a
        "Quick demo sign in // admin" button that posts the hardcoded pair
        admin@flare.dev / admin123 (flare/AuthPanel.jsx:72).
        THE ACCOUNT IS NOT SEEDED BY DEFAULT. It exists only when the server is
        started with `--demo-seed`. On a default boot the row does not exist,
        this endpoint returns 401, and the button surfaces that through the
        existing error path — the button is expected to fail, and that is the
        intended behaviour, not a bug to work around.
        The credentials must never appear in the README (PLAN §9). They are
        already public in the shipped frontend bundle, which is exactly why the
        account must not exist unless someone deliberately asks for it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/register:
    post:
      tags: [auth]
      summary: Create an operator account
      x-flare-envelope: none   # PINNED EXCEPTION 2/11 — AuthContext.jsx:171 reads data.access_token
      security: []
      description: >
        AuthContext.jsx:150. Same raw shape as login. NOTE: the register form
        has a role selector (flare/AuthPanel.jsx:214-251) but
        AuthContext.jsx:153 never transmits it — the frontend cannot request a
        role. Role is assigned server-side and defaults to `viewer`
        (PLAN §9: a user cannot set their own role).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, format: email }
                name: { type: string, minLength: 1 }
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: >
                    Frontend enforces >= 8 client-side
                    (RegisterPage.jsx:29, flare/AuthPanel.jsx:53). The backend
                    must enforce it independently.
      responses:
        '200':
          description: Registered and authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new pair
      x-flare-envelope: none   # PINNED EXCEPTION 3/11 — AuthContext.jsx:71 reads data.access_token
      security: []
      description: >
        AuthContext.jsx:42 (scheduled, 5 min before expiry) and
        AuthContext.jsx:64 (reactive, on 401). Frontend reads
        data.access_token and data.refresh_token; `user` is not read on this
        path. Any non-2xx clears all auth state (AuthContext.jsx:47, 69).
        Rotation is expected — the frontend overwrites both stored tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: Current user
      x-flare-envelope: none   # PINNED EXCEPTION 4/11 — AuthContext.jsx:93 setUser(data), whole body
      description: >
        AuthContext.jsx:85 and :101. The WHOLE body becomes the `user` object
        (`setUser(data)`), so it must not be enveloped. Only `name` and `email`
        are read by the render path (pages/SettingsPage.jsx:15-16);
        ProtectedRoute only tests truthiness (ProtectedRoute.jsx:18).
        A 401 here triggers exactly one refresh-and-retry
        (AuthContext.jsx:89, 98-108).
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/profile:
    put:
      tags: [auth]
      summary: Update own profile
      description: >
        pages/SettingsPage.jsx:24, via authFetch (refresh-aware). Only res.ok
        is read — the response body is discarded (SettingsPage.jsx:29).
        Not listed in PLAN §3.1; see CONTRACT.md §6.2.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Email already in use
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/change-password:
    post:
      tags: [auth]
      summary: Change own password
      description: >
        pages/SettingsPage.jsx:66, via authFetch. On failure the frontend reads
        err.detail and renders it verbatim (SettingsPage.jsx:72), so the
        `detail` string is user-facing — keep it precise and free of internals.
        PLAN §9 requires this to invalidate outstanding refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, format: password }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        '200':
          description: Password changed; outstanding refresh tokens revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
        '400':
          description: Current password incorrect, or new password rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────────────────────────────────────────────────
  # ALERTS — specified but NOT CALLED by the frozen frontend.
  # ─────────────────────────────────────────────────────────────────────

  /alerts:
    get:
      tags: [alerts]
      summary: Persisted alert list
      description: >
        SANCTIONED CHANGE FE-6. The frozen frontend calls nothing here — the
        feed is WebSocket-only, so a reload shows an empty table (PLAN T17,
        CONTRACT.md §8.8). FE-6 adds a fetch on mount in DashboardPage.jsx that
        HYDRATES THE TABLE BEFORE THE WEBSOCKET TAKES OVER; the WS then
        prepends live alerts onto that seeded buffer.

        Consequences for this endpoint:
        * ENVELOPED — no frozen consumer constrains it, so it takes the D17
          default. FE-6 reads `json.data.alerts`.
        * Sort order is NEWEST FIRST, matching the WS prepend
          (DashboardPage.jsx:35) so the hydrated and live halves are ordered
          consistently.
        * Items are the SAME Alert schema the WS pushes, `trace` included, so
          the merge is a concat and a de-dupe on `id` with no reshaping.
        * The client caps its buffer at 200 (DashboardPage.jsx:35); a default
          `limit` at or below that keeps hydration from being immediately
          truncated.
        * FE-6 must de-dupe by `id` — an alert can arrive over the WS while the
          hydration request is in flight.
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: attack_type
          in: query
          schema: { type: string }
        - name: search
          in: query
          description: Matches src_ip, dest_ip, alert id, or signature (PLAN §3.1).
          schema: { type: string }
      responses:
        '200':
          description: Paginated alerts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [alerts, total]
                        properties:
                          alerts:
                            type: array
                            items: { $ref: '#/components/schemas/Alert' }
                          total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /alerts/attack-types:
    get:
      tags: [alerts]
      summary: The attack types the data actually contains
      description: >
        SANCTIONED CHANGE FE-11. `FilterStrip.jsx:40-45` hardcodes six vector
        options — `sql_injection`, `brute_force`, `port_scan`, `ddos`,
        `malware`, `other`. The partitions built from CICIDS2017 contain
        `benign`, `dos`, `ddos`, `port_scan`, `botnet`, `web_attack`. Only two
        overlap, so four options match nothing and four real classes cannot be
        filtered for at all. A dropdown whose options are mostly dead is worse
        than no dropdown.

        FE-11 replaces the hardcoded array with a fetch of this endpoint on
        mount. The list is derived from the committed partition manifest, not
        from a second hardcoded list on the server — a canonical set that
        drifts from the data would reproduce the same defect one layer down.

        `label` is supplied so the frontend renders a name without owning a
        mapping; the frozen table's own `.replaceAll('_',' ')` (AlertTable.jsx:126)
        stays correct for `attack_type` values themselves.

        ENVELOPED — no frozen consumer constrains it, so it takes the D17
        default.
      responses:
        '200':
          description: The canonical classes present in the partitions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [attack_types]
                        properties:
                          attack_types:
                            type: array
                            items:
                              type: object
                              required: [value, label, severity]
                              properties:
                                value: { $ref: '#/components/schemas/AttackType' }
                                label:
                                  type: string
                                  description: Display form, e.g. `PORT SCAN`.
                                severity: { $ref: '#/components/schemas/Severity' }
                          excluded:
                            type: object
                            description: >
                              Classes present in the raw capture but deliberately
                              not modelled, with the reason and the row count.
                              Reported rather than hidden — `heartbleed` has 11
                              flows in the entire capture and cannot survive a
                              three-way split.
                            additionalProperties:
                              type: object
                              properties:
                                reason: { type: string }
                                rows_available: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────────────────────────────────────────────────
  # CORRELATION, RIGHT RAIL, HEADER — PHASE 4.
  #
  # CONTRACT.md §6.1 lists these as "listed in PLAN §3.1, no backing call
  # exists", four of them at High severity: threat clusters, signal velocity,
  # attack surface, pipeline activity and the threat forecast. There is nothing
  # to repoint — the panels take props and compute literals (CONTRACT.md §7.4).
  # These are the producers PLAN I2 requires. All three are ENVELOPED: no frozen
  # consumer constrains them, so they take the D17 default and none of them
  # joins the closed eleven-entry exception list.
  # ─────────────────────────────────────────────────────────────────────

  /alerts/clusters:
    get:
      tags: [alerts]
      summary: Source-IP correlation clusters
      description: >
        PLAN §3.1 — "served from the DB with a real min_alerts threshold". The
        frozen frontend reduces its 200-alert buffer client-side and calls every
        source IP with one alert a cluster (WorkspacePanel.jsx:498).

        SERVED FROM STORED OUTPUT. The scheduler's `correlation.refresh` job
        writes `alert_clusters` and this endpoint reads it; it does not
        recompute. That is what makes the job load-bearing rather than
        decorative (PLAN T14) — a job that aggregated and discarded would show
        as an empty screen instead of being invisible. The job stores every
        group and the THRESHOLD IS APPLIED ON READ, so `min_alerts` can lower
        the floor as well as raise it.

        `computed_at` is on the payload because a stored aggregate has an age,
        and a screen that cannot say how old its numbers are can show stale ones
        without anyone noticing.
      parameters:
        - name: min_alerts
          in: query
          required: false
          description: >
            Defaults to `correlation_min_alerts` from config. A source IP below
            this floor is not a cluster.
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Clusters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ClusterPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /metrics/rail:
    get:
      tags: [metrics]
      summary: All four right-rail panels
      description: >
        One round trip rather than four: the panels render together in a single
        column, and four requests on every dashboard mount is three more chances
        for one of them to be the slow one.

        Replaces, in order (CONTRACT.md §7.4) —
        `+18.4%` becomes threat_forecast.change_pct (PLAN D8);
        the `x 62` scale on the series becomes signal_velocity, sampled once per
        interval by the scheduler;
        `window 60m` becomes signal_velocity.window_minutes, the real span the
        samples cover;
        `3 hot` becomes attack_surface.hot;
        `08 origins // 08 paths` becomes attack_surface.origins and .paths;
        `10.24.0.0/16` becomes attack_surface.dominant_subnet, measured;
        the loads `0.82 / 0.64 / 0.71 / 0.45` become
        pipeline_activity.nodes[].load (PLAN D9).
      responses:
        '200':
          description: Right-rail metrics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RailPayload' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /metrics/overview:
    get:
      tags: [metrics]
      summary: Header counters and the top-bar ticker
      description: >
        PLAN §3.1 — counters over the ACTIVE FILTER SET. The frozen frontend
        counts its unfiltered 200-alert buffer (DashboardView.jsx:65), so its
        TOTAL/HIGH/MEDIUM disagree with the table as soon as a filter is on.
        The same filter predicates as GET /alerts are used, so the two cannot
        diverge. `search` is the unified search across source IP, destination
        IP, alert id and signature (PLAN §3.1).
      parameters:
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - name: attack_type
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Counters and ticker
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/OverviewPayload' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────────────────────────────────────────────────
  # SCHEDULER — no frontend consumer. PLAN §4.1 / T14.
  # ─────────────────────────────────────────────────────────────────────

  /admin/jobs:
    get:
      tags: [admin]
      summary: Scheduled-job receipts — admin only
      description: >
        PLAN T14 — every job persists what it computes, and this is the
        receipt: which job, when, how long, and the counts it wrote. A run that
        raised keeps its exception text. This is what makes "the scheduler is
        running" a checkable claim rather than an assertion.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        '200':
          description: Job runs, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/jobs/{job}/run:
    post:
      tags: [admin]
      summary: Run a scheduled job now — admin only
      description: >
        PLAN §4.1 — job triggers are audited. A MANUAL trigger carries the
        operator's id into the audit row; a scheduled run does not, which is
        what distinguishes "somebody asked for this" from "the timer fired".
      parameters:
        - name: job
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The run's receipt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/JobRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────────────────
  # INGEST — no frontend consumer. PLAN D23 / §4.4a, Phase 4a.
  # ─────────────────────────────────────────────────────────────────────

  /ingest/eve:
    post:
      tags: [ingest]
      summary: Live Suricata EVE ingestion (staged-attack demo)
      security:
        - serviceToken: []
      description: >
        PLAN D23, §4.4a. NOT CALLED BY THE FRONTEND — the client is our own
        forwarder script, which tails `eve.json` on the target box and POSTs new
        events. SPEC ONLY; built in Phase 4a, after Phase 4.

        Events feed THE SAME normalizer and THE SAME graph as replay, tagged
        `source: "live_demo"` (D24).

        SECURITY — this is the only route accepting unsolicited external input
        and is treated as its own attack surface (PLAN §9):
        * DEDICATED SERVICE TOKEN, not a user JWT — separately revocable, and
          never the demo account's credentials.
        * ITS OWN RATE LIMIT, independent of the user-facing limiter.
        * PAYLOAD SIZE CAP, enforced before parsing.
        * PER-EVENT SCHEMA VALIDATION, strict on the fields the normalizer
          CONSUMES and permissive about the rest. A malformed value in a field
          we read rejects THAT RECORD — counted, never fatal to the batch.
          Unknown top-level keys are IGNORED, not rejected, and are discarded
          unread so nothing outside the consumed set reaches the pipeline.
          This is the only implementable rule, not a relaxation: real Suricata
          8.0.6 alert records carry 22 top-level keys against the nine named
          below, so rejecting on unknown fields rejects 107 of 107 real records
          and the endpoint can never ingest live output.
        * EVERY INTERPOLATED FIELD ESCAPED like any other untrusted input. A
          Suricata signature is attacker-influenced by construction — the
          attacker chooses the traffic that generates it — so it reaches a
          prompt only escaped, length-capped and delimited.
        * DISABLED BY DEFAULT; enabled only by explicit config.

        NO GROUND TRUTH. Events ingested here carry no label. PLAN I15
        (extended): a `live_demo` row must never enter the eval or training set,
        and a test enforces it.

        ROUTING. EVE records have no CICIDS flow features, so these alerts take
        the D25 path — the LightGBM tier is SKIPPED with an explicit `skipped`
        trace entry naming the reason, and the alert routes straight to the LLM.
        Not a silent bypass (PLAN I5).

        ISOLATION. PLAN I19: this endpoint failing, hanging or being switched
        off must have zero effect on replay, the eval, or any screen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  description: >
                    A batch of Suricata EVE JSON records, exactly as the
                    forwarder read them. Only `event_type: "alert"` records are
                    ingested; every other event type is COUNTED and reported in
                    `dropped_breakdown`, never silently discarded — an eve.json
                    is mostly flow/http/dns/stats records.

                    The properties below are the subset the normalizer CONSUMES
                    and the only ones validated. Real records carry many more
                    (`in_iface`, `pkt_src`, `ip_v`, `app_proto`, `direction`,
                    `flow`, `metadata`, `tx_id`, `http`, `files`, `tls`, …);
                    those are accepted and DISCARDED UNREAD rather than
                    rejected, so a Suricata version bump cannot break ingestion.
                  items:
                    type: object
                    additionalProperties: true
                    required: [timestamp, alert]
                    properties:
                      timestamp: { type: string, format: date-time }
                      event_type:
                        type: string
                        description: >
                          Anything other than `alert` is counted under
                          `not_an_alert_record` and dropped. Not a validation
                          error.
                      src_ip: { type: string }
                      src_port: { type: integer, minimum: 0, maximum: 65535 }
                      dest_ip: { type: string }
                      dest_port: { type: integer, minimum: 0, maximum: 65535 }
                      proto: { type: string }
                      alert:
                        type: object
                        additionalProperties: true
                        required: [signature]
                        properties:
                          signature_id: { type: integer }
                          signature: { type: string, minLength: 1, maxLength: 512 }
                          category: { type: string, maxLength: 256 }
                          severity: { type: integer, minimum: 1, maximum: 4 }
      responses:
        '202':
          description: Accepted for triage
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accepted, dropped]
                        properties:
                          accepted:
                            type: integer
                            description: Records queued for triage.
