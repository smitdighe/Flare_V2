  # ─────────────────────────────────────────────────────────────────────
  # HEALTH — frontend/src/components/WorkspacePanel.jsx:10-114
  # ─────────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [health]
      summary: Cheap health — local state only, NO provider calls
      description: >
        CHEAP AND LOCAL — DECIDED. This endpoint MUST NOT make any outbound
        provider call. It answers from locally held state: last known status per
        dependency, the latency recorded on the last real probe, DB
        reachability, queue depth. Zero Groq / Gemini / AbuseIPDB / VirusTotal
        quota is consumed, no matter how often it is hit.

        This is the endpoint on the 30-second timer. WorkspacePanel.jsx:18 with
        `setInterval(fetchHealth, 30000)` at WorkspacePanel.jsx:39, plus a
        manual Refresh button. If it probed providers it would burn four metered
        quotas every 30 seconds per open tab (PLAN T4/§10) and exhaust the
        Gemini free tier inside the demo.

        SCOPE CORRECTION: this poll is NOT in the top bar. It lives in
        HealthPanel, which mounts only while the Health Metrics screen is open
        (WorkspacePanel.jsx:1137), so the timer runs only on that screen and
        stops on navigate-away. TopBar.jsx makes no network call at all — its
        3600 ms interval (TopBar.jsx:15) only rotates the client-side ticker.
        Nothing in the frozen frontend calls /health/deep. See CONTRACT.md §9.5.

        CACHE POLICY — DECIDED. Provider check results are cached for
        60 SECONDS. A cached result older than 120 SECONDS is STALE and must be
        refreshed on the next request rather than served. Between 60s and 120s
        the cached value is served as-is.
        With the HealthPanel poll at 30s, that means the poll hits warm cache
        most of the time and NEVER live-probes a provider from this endpoint —
        the refresh at the 120s boundary reads local state, not the network.
        Any genuine provider probing happens through /health/deep only.

        `latency_ms` values served here are the ones measured by the last real
        probe, with `checked_at` saying when that was — cached measurements,
        never synthesized. A dependency never yet probed reports
        `status: unknown` with `latency_ms: null`, never `ok`.

        Envelope-tolerant (`json.data || json`, WorkspacePanel.jsx:28).
        Authenticated — the frontend sends a Bearer token
        (WorkspacePanel.jsx:19) and PLAN §9 requires it (an anonymous health
        endpoint is how the prior codebase leaked four quotas per anonymous
        hit). On a non-2xx the frontend renders `res.text()` raw
        (WorkspacePanel.jsx:24), so error bodies here are user-facing.
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HealthPayload' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /health/deep:
    get:
      tags: [health]
      summary: Deep probe — MANUAL REFRESH ONLY, makes real provider calls
      description: >
        MANUAL-REFRESH-ONLY — DECIDED. This is the real four-provider probe
        (Groq, Gemini, AbuseIPDB, VirusTotal) and it SPENDS METERED QUOTA on
        every call. It must never sit behind a timer.

        Triggered only by the explicit Refresh button on the Health Metrics
        screen (WorkspacePanel.jsx:51 / :81), and directly by the operator
        during the demo-day runbook quota check (PLAN §19 step 3).

        The frozen frontend does not call this path — its Refresh button hits
        /health. Pointing that button here is part of the FE-3 base-path pass;
        until then the deep probe is operator-invoked only. Whichever way it is
        wired, THE 30-SECOND TIMER MUST KEEP HITTING /health, NOT THIS.

        Every result written here updates the cached state that /health serves,
        so a manual refresh is what makes the cheap endpoint's numbers current.
        Rate-limit this endpoint per user regardless of who calls it.

        Shape is not constrained by any frozen consumer; fields are from
        PLAN §11.
      responses:
        '200':
          description: Deep health
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          services:
                            type: array
                            items: { $ref: '#/components/schemas/ServiceHealth' }
                          queue_depth:
                            type: object
                            additionalProperties: { type: integer }
                          in_flight: { type: integer }
                          dropped:
                            type: object
                            additionalProperties: { type: integer }
                          degraded: { type: boolean }
                          offline_mode: { type: boolean }
                          providers:
                            type: object
                            description: >
                              PLAN I16 — model IDs and per-key COUNTERS, keyed
                              by label. `groq.keys[]` / `gemini.keys[]` each
                              carry {key_id, purpose, dead, dead_reason,
                              cooling, cooling_for_seconds, calls,
                              rate_limited}, and each provider additionally
                              carries `live_keys` (int) and `dead_keys`
                              ({key_id: reason}). Never key material.


                              PLAN D39 — `dead` and `cooling` are SEPARATE
                              facts and must not be conflated by a consumer. A
                              429 cools a key and it returns on its own; a hard
                              auth rejection (403 project-denied, 401, or a 400
                              carrying an explicit invalid-key marker) removes
                              it for the process lifetime and only a new
                              credential brings it back. A dead key reports
                              `cooling: false` and `cooling_for_seconds: 0`,
                              because it is not waiting for anything.
                          reason_budget:
                            type: object
                            description: >
                              PLAN §10.4 — the reasoning rate budget:
                              {calls_per_minute, capacity, available, admitted,
                              rejected}. `rejected` counts alerts above the
                              severity floor that the free-tier cap turned away;
                              each one carries a traced skip on its alert.
                          intel_cache:
                            type: object
                            description: >
                              PLAN §10.2 — per-IP cache stats {entries,
                              max_entries, ttl_seconds, hits, misses}. Hits are
                              quota units not spent.
        '401': { $ref: '#/components/responses/Unauthorized' }

